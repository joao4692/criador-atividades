[project]
name = "criador-atividades-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Dependências ficam em requirements.in / requirements.lock. Aqui só configuração.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
