# Ambiente de DESENVOLVIMENTO. Subir tudo: docker compose up --build
# Só o líder edita este arquivo (CODEOWNERS).
name: criador-atividades

services:
  db:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 = só a sua máquina enxerga. 5433 evita conflito com um Postgres local.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
    env_file: .env
    environment:
      WATCHFILES_FORCE_POLLING: ${WATCH_POLLING:-false}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    # Sem env_file de propósito: nenhum segredo (chave do Grok etc.) chega ao frontend.
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: ${WATCH_POLLING:-false}
    volumes:
      - ./frontend:/app
      # Volume anônimo: o node_modules do container não é coberto pela pasta da sua máquina.
      - /app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
